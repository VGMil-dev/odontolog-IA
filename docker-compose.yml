services:
  # -------------------------------------------------------------
  # 🧠 1. OdontoCare IA — NestJS API Backend
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: odontocare-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TZ=America/Guayaquil
      - DATABASE_URL=postgresql://odontocare:odontocare_secret_pass@postgres:5432/odontocare_db?schema=public
      - JWT_SECRET=${JWT_SECRET:-odonto_jwt_secret_key_2026_change_this}
      - REDIS_URL=redis://redis:6379
      - PRIMARY_MODEL=${PRIMARY_MODEL:-openai/gpt-4o-mini}
      - FALLBACK_MODEL=${FALLBACK_MODEL:-google/gemini-2.5-flash}
      - VERCEL_AI_GATEWAY_KEY=${VERCEL_AI_GATEWAY_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - odontocare-net

  # -------------------------------------------------------------
  # 🌐 2. OdontoCare Web — Next.js Frontend
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: odontocare-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:3000
    depends_on:
      - api
    networks:
      - odontocare-net

  # -------------------------------------------------------------
  # ⚡ 3. Redis — Buffer Anti-Ráfagas, Colas y Bloqueos
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: odontocare-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - odontocare-net

  # -------------------------------------------------------------
  # 🐘 4. PostgreSQL — Persistencia Principal
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: odontocare-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=odontocare
      - POSTGRES_PASSWORD=odontocare_secret_pass
      - POSTGRES_DB=odontocare_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odontocare -d odontocare_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - odontocare-net

networks:
  odontocare-net:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
